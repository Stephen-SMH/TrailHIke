<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="640" fill="#F6F2E8"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1B1B1B"/></marker></defs><text x="30" y="36" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start">TrailMark: the big picture</text><text x="30" y="58" font-size="14" font-weight="400" fill="#555" text-anchor="start">The phone does the work. The cloud is a backup, a sharing hub and a map shop.</text><rect x="30" y="90" width="520" height="520" rx="12" fill="#DCE9F0" stroke="#2F5D3A" stroke-width="1.6"/><text x="290.0" y="355.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle"></text><text x="50" y="120" font-size="14" font-weight="700" fill="#2F5D3A" text-anchor="start">THE PHONE (works with no signal)</text><rect x="60" y="140" width="460" height="56" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="290.0" y="165.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Screens</text><text x="290.0" y="184.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">Home, Record, Hike detail, Map</text><rect x="60" y="224" width="210" height="64" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="165.0" y="253.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">GPS source</text><text x="165.0" y="272.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">real chip or simulator</text><rect x="310" y="224" width="210" height="64" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="415.0" y="253.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Recorder</text><text x="415.0" y="272.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">filter bad fixes, batch saves</text><rect x="60" y="330" width="460" height="64" rx="12" fill="#EFE6CF" stroke="#1B1B1B" stroke-width="1.6"/><text x="290.0" y="359.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Local database (SQLite)</text><text x="290.0" y="378.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">hikes, GPS points, sync bookmark: the SOURCE OF TRUTH</text><rect x="60" y="430" width="210" height="64" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="165.0" y="459.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Outbox</text><text x="165.0" y="478.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">"please upload hike X"</text><rect x="310" y="430" width="210" height="64" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="415.0" y="459.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Sync engine</text><text x="415.0" y="478.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">push, then pull</text><rect x="60" y="526" width="460" height="64" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6" stroke-dasharray="6 5"/><text x="290.0" y="555.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Offline map pack</text><text x="290.0" y="574.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">downloaded from the Tile CDN before the trip (not built yet)</text><line x1="165" y1="224" x2="165" y2="198" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><line x1="310" y1="256" x2="270" y2="256" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><line x1="415" y1="288" x2="415" y2="330" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="440" y="301.0" font-size="12" font-weight="400" fill="#444" text-anchor="middle">saves</text><line x1="165" y1="394" x2="165" y2="430" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="190" y="404.0" font-size="12" font-weight="400" fill="#444" text-anchor="middle">queue</text><line x1="270" y1="462" x2="310" y2="462" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><line x1="415" y1="430" x2="415" y2="396" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="455" y="418" font-size="12" font-weight="400" fill="#444" text-anchor="middle">reads/writes</text><line x1="290" y1="196" x2="290" y2="330" stroke="#999" stroke-width="1.8" marker-end="url(#arr)"/><text x="315" y="300" font-size="12" font-weight="400" fill="#444" text-anchor="middle">reads</text><rect x="650" y="90" width="520" height="520" rx="12" fill="#E9F1E3" stroke="#2F5D3A" stroke-width="1.6"/><text x="910.0" y="355.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle"></text><text x="670" y="120" font-size="14" font-weight="700" fill="#2F5D3A" text-anchor="start">THE CLOUD (production plan)</text><rect x="680" y="140" width="460" height="56" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="910.0" y="165.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">API + login</text><text x="910.0" y="184.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">REST / GraphQL, tokens</text><rect x="680" y="224" width="210" height="76" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="785.0" y="259.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Postgres + PostGIS</text><text x="785.0" y="278.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">hikes, tracks, trails, users</text><rect x="930" y="224" width="210" height="76" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="1035.0" y="259.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">File storage</text><text x="1035.0" y="278.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">GPX files, photos (S3 / R2)</text><rect x="680" y="330" width="210" height="76" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="785.0" y="365.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Background jobs</text><text x="785.0" y="384.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">clean tracks, make thumbnails</text><rect x="930" y="330" width="210" height="76" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="1035.0" y="365.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Tile CDN</text><text x="1035.0" y="384.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">map tiles (PMTiles)</text><rect x="680" y="440" width="460" height="64" rx="12" fill="#fff" stroke="#1B1B1B" stroke-width="1.6"/><text x="910.0" y="469.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Live sharing + alerts</text><text x="910.0" y="488.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">"last known position" for family, weather warnings</text><rect x="680" y="526" width="460" height="64" rx="12" fill="#fff" stroke="#C8553D" stroke-width="1.6" stroke-dasharray="6 5"/><text x="910.0" y="555.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Prototype stand-in: FakeServer</text><text x="910.0" y="574.0" font-size="12" font-weight="400" fill="#555" text-anchor="middle">same rules, lives in memory, can be switched offline</text><line x1="910" y1="196" x2="910" y2="224" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><line x1="785" y1="196" x2="785" y2="224" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><line x1="785" y1="300" x2="785" y2="330" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><line x1="1035" y1="300" x2="1035" y2="330" stroke="#1B1B1B" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><line x1="520" y1="462" x2="680" y2="168" stroke="#C8553D" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="600" y="456" font-size="12" font-weight="700" fill="#C8553D" text-anchor="middle">only when</text><text x="600" y="472" font-size="12" font-weight="700" fill="#C8553D" text-anchor="middle">there is signal</text></svg>