<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="600" fill="#F6F2E8"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1B1B1B"/></marker></defs><text x="30" y="36" font-size="22" font-weight="700" fill="#1B1B1B" text-anchor="start">One weekend, step by step: what happens with and without signal</text><rect x="130" y="70" width="200" height="44" rx="12" fill="#DCE9F0" stroke="#2F5D3A" stroke-width="1.6"/><text x="230.0" y="97.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Phone</text><rect x="860" y="70" width="200" height="44" rx="12" fill="#E9F1E3" stroke="#2F5D3A" stroke-width="1.6"/><text x="960.0" y="97.0" font-size="15" font-weight="700" fill="#1B1B1B" text-anchor="middle">Server</text><line x1="230" y1="114" x2="230" y2="580" stroke="#999" stroke-dasharray="4 5"/><line x1="960" y1="114" x2="960" y2="580" stroke="#999" stroke-dasharray="4 5"/><rect x="20" y="130" width="1160" height="110" fill="#E3EFD9" opacity=".55"/><text x="30" y="148" font-size="12" font-weight="700" fill="#444" text-anchor="start">AT HOME  -  signal OK</text><rect x="20" y="250" width="1160" height="190" fill="#FCE9D9" opacity=".55"/><text x="30" y="268" font-size="12" font-weight="700" fill="#444" text-anchor="start">ON THE TRAIL  -  no signal</text><rect x="20" y="450" width="1160" height="130" fill="#E3EFD9" opacity=".55"/><text x="30" y="468" font-size="12" font-weight="700" fill="#444" text-anchor="start">BACK IN TOWN  -  signal returns</text><line x1="240" y1="175" x2="950" y2="175" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="600" y="165" font-size="12" font-weight="400" fill="#444" text-anchor="middle">1. pull: "anything new since bookmark 0?"</text><line x1="950" y1="205" x2="240" y2="205" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="600" y="198" font-size="12" font-weight="400" fill="#444" text-anchor="middle">bookmark = 12</text><text x="250" y="290" font-size="13" font-weight="400" fill="#1B1B1B" text-anchor="start">2. Press Start. Every GPS fix is saved to the phone.</text><text x="250" y="316" font-size="13" font-weight="400" fill="#1B1B1B" text-anchor="start">3. Press Finish. Hike saved + added to the OUTBOX.</text><text x="250" y="342" font-size="13" font-weight="400" fill="#C8553D" text-anchor="start">4. Upload tried, fails quietly. Banner: "1 waiting to upload".</text><text x="250" y="368" font-size="13" font-weight="400" fill="#1B1B1B" text-anchor="start">5. Rename the hike. Still works. Outbox still holds just ONE entry</text><text x="250" y="386" font-size="13" font-weight="400" fill="#1B1B1B" text-anchor="start">    (the newest version replaces the older one).</text><text x="250" y="420" font-size="13" font-weight="700" fill="#2F5D3A" text-anchor="start">Nothing is ever lost, and the app never says "no connection" and refuses.</text><text x="1000" y="330" font-size="13" font-weight="400" fill="#999" text-anchor="start">(unreachable)</text><line x1="240" y1="490" x2="950" y2="490" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="600" y="480" font-size="12" font-weight="400" fill="#444" text-anchor="middle">6. push: the latest version of the hike + its points</text><line x1="950" y1="520" x2="240" y2="520" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="600" y="513" font-size="12" font-weight="400" fill="#444" text-anchor="middle">7. OK  (server keeps it; asking twice is harmless)</text><line x1="240" y1="556" x2="950" y2="556" stroke="#1B1B1B" stroke-width="1.8" marker-end="url(#arr)"/><text x="600" y="548" font-size="12" font-weight="400" fill="#444" text-anchor="middle">8. pull: anything new since bookmark 12?</text></svg>